# Modelo de CI da equipe para projetos Node/Vite (copiar para .github/workflows/ci.yml).
# Roda em todo push e pull request; os mesmos verificadores locais do estagio0.sh.
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read
  # gitleaks-action lista os commits do PR pela API em eventos pull_request.
  pull-requests: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verificar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck --if-present
      - run: npm run lint --if-present
      - run: npm run test:coverage --if-present || npm test
      - run: npm run build --if-present
      - name: Dependências com vulnerabilidade alta
        run: npm audit --omit=dev --audit-level=high

  seguranca:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Segredos no histórico (gitleaks)
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Análise estática de segurança (semgrep)
        run: pipx run semgrep scan --config p/security-audit --config p/secrets --config p/typescript --metrics=off --error --exclude .ai_workspace .
